<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Tech Cyan to Electric Blue Gradient -->
    <linearGradient id="sysGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#00C0FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Subtle Drop Glow Filter -->
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00C0FA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1200" height="480" fill="#FFFFFF"/>

  <!-- Logo Container -->
  <g transform="translate(140, 110)">
    
    <!-- Closed-Loop End-to-End System Glyph (Infinity Action Circuit) -->
    <g transform="translate(40, 15)" filter="url(#circuitGlow)">
      <!-- Left Outer Loop -->
      <path d="M 90 20 C 40 20 0 60 0 110 C 0 160 40 200 90 200 C 135 200 170 170 195 135 L 160 110 C 145 135 120 155 90 155 C 65 155 45 135 45 110 C 45 85 65 65 90 65 C 120 65 145 85 160 110 L 195 85 C 170 50 135 20 90 20 Z" fill="url(#sysGradient)"/>
      
      <!-- Right Outer Loop (Interlocking) -->
      <path d="M 230 20 C 185 20 150 50 125 85 L 160 110 C 175 85 200 65 230 65 C 255 65 275 85 275 110 C 275 135 255 155 230 155 C 200 155 175 135 160 110 L 125 135 C 150 170 185 200 230 200 C 280 200 320 160 320 110 C 320 60 280 20 230 20 Z" fill="url(#sysGradient)"/>
      
      <!-- Central Interlocking Diamond Node (Precision Fintech / Telemetry Core) -->
      <polygon points="160,82 188,110 160,138 132,110" fill="#00F2FE"/>
    </g>

    <!-- Wordmark 'ACTA' -->
    <g transform="translate(410, 0)">
      <text x="0" y="165" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="160" font-weight="900" fill="#0F172A" letter-spacing="-2">ACTA</text>
      
      <!-- Tagline: "Small Acts. Big Impact." -->
      <text x="5" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="600" fill="#334155" letter-spacing="4">Small Acts. Big Impact.</text>

      <!-- Subtitle: "by Resence | Impact Operating System" -->
      <g transform="translate(5, 245)">
        <text x="0" y="18" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700" fill="#64748B" letter-spacing="1.5">by RESENCE <tspan fill="#CBD5E1">|</tspan> END-TO-END IMPACT SYSTEM</text>
      </g>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Modern Tech Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="480" fill="#FFFFFF"/>

  <!-- Brand Wordmark Container -->
  <g transform="translate(180, 80)">
    
    <!-- Letter 'A' (First) -->
    <text x="60" y="195" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="190" font-weight="800" fill="url(#navyGrad)" letter-spacing="-3">A</text>

    <!-- Stylized Letter 'C' Emblem (Hand & Sprout Symbol) -->
    <g transform="translate(230, 20)" filter="url(#softGlow)">
      <!-- Outer C Arc / Cupped Hand -->
      <path d="M 125 15 C 65 15 20 60 20 120 C 20 175 60 215 120 215 C 155 215 185 198 202 178 C 175 192 140 188 118 172 C 95 155 92 135 110 135 C 135 135 160 148 185 142 C 198 139 205 130 200 120 C 190 120 170 124 150 120 C 130 116 115 105 105 90 C 85 62 100 35 125 15 Z" fill="url(#emeraldGrad)"/>
      
      <!-- Sprouting Leaf (Left) -->
      <path d="M 125 130 C 115 100 85 95 75 90 C 70 108 85 132 125 130 Z" fill="#10B981"/>
      
      <!-- Sprouting Leaf (Right) -->
      <path d="M 128 128 C 140 90 180 80 190 75 C 195 98 175 128 128 128 Z" fill="#059669"/>
    </g>

    <!-- Letter 'T' -->
    <text x="500" y="195" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="190" font-weight="800" fill="url(#navyGrad)" letter-spacing="-3">T</text>

    <!-- Letter 'A' (Second) -->
    <text x="635" y="195" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="190" font-weight="800" fill="url(#navyGrad)" letter-spacing="-3">A</text>

    <!-- Tagline: "Small Acts. Big Impact." -->
    <text x="145" y="275" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="34" font-weight="600" fill="#334155" letter-spacing="4.5">Small Acts. Big Impact.</text>

    <!-- Badge: "by Resence" -->
    <g transform="translate(620, 248)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="82" y="23" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="1">by Resence</text>
    </g>
  </g>
</svg>
